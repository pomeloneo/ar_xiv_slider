<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><ol><li><p>因为不知道撤单来自队列前方还是后方，聚合数量没有订单身份。</p></li><li><p>主动单立即与现有对手方成交，不依赖自己的 FIFO 排队位置。</p></li><li><p>策略选择只被部分识别，对不可观测队列假设敏感，不能报告为唯一最优。</p></li></ol><p><a href="notes.html">返回详细讲解</a></p></article></main>
