<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><p>各投一半不保证风险各一半，波动幅度与共同涨跌关系都会影响贡献。在互不相关的 10% 与 20% 例子中，后者的半仓方差贡献是前者的四倍。</p><p>只提高估计均值而保持其他分布参数和权重不变时，去均值 EVaR 不变；原始 EVaR 会减少，对应资产的原始贡献也减去 w_i×均值增量。关键假设是风险函数及其导数可用，正态特例不能替代论文厚尾模型实证。</p><p><a href="notes.html">返回详细讲解</a></p></article></main>
