<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><p>同一组合的名义收益不变，γ 增大使扣减项 γ√(xᵀDx) 变大，因此最坏收益下降，可能低于目标。优化器必须改变配置或判定不可行。</p><p>更稀疏与更稳健不必同方向：稀疏惩罚想减少非零项目，稳健约束可能需要更多互补项目才能达到最低收益。关键前提是论文的椭球均值不确定性、正定协方差和允许的持仓范围。实践只枚举三资产解析特例，没有运行大规模算法或市场回测。</p><p><a href="notes.html">返回详细讲解</a></p></article></main>
