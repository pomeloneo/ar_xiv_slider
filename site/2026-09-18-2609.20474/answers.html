<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><ol><li><p>它只阻止错误交付，没有修复环境或完成目标，因此改变的是接受决定而非 oracle success。</p></li><li><p>它控制了额外字数、包装和提示存在本身，剩余差异更接近任务专属信息的价值。</p></li><li><p>应优先看避免的 false pass 及错拦代价，再结合成本，而不是只看平均成功率。</p></li></ol><p><a href="notes.html">返回详细讲解</a></p></article></main>
