<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><ol><li><p>说明按当前技术、成本和贸易条件，额外满足一单位安全目标更昂贵。</p></li><li><p>实现同一目标所需税率随需求、成本和可靠性变化，固定税率必须事先估计这些条件；证书价格可随市场清算。</p></li><li><p>极端情况下可继续高价进口，但原先的硬数量安全目标不再必然满足。</p></li></ol><p><a href="notes.html">返回详细讲解</a></p></article></main>
