<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><p>同日差值给所有共同项配上 +1 与 −1 的权重，系数加起来为零，所以共同市场冲击与同质共同拥挤都会被消去。扩大同类样本只改善自身影响估计的精度，不恢复共同项的信息。</p><p>若要研究整体拥挤，需要让共同投入或各单位对它的暴露发生可识别变化，并处理新增的日期或重叠假设。长期影响校正还依赖正确积累核。教学程序没有真正部署资金，也没有估计实际策略容量。</p><p><a href="notes.html">返回详细讲解</a></p></article></main>
