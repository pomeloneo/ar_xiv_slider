<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>每日 arXiv 论文带读</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18212f;
      background: #f3f6fb;
    }
    body {
      max-width: 880px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    header {
      margin-bottom: 40px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      letter-spacing: -0.045em;
    }
    p {
      color: #526071;
      font-size: 1.05rem;
      line-height: 1.75;
    }
    .empty {
      padding: 28px;
      border: 1px solid #dbe3ee;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 14px 38px rgb(40 61 89 / 8%);
    }
    .papers {
      display: grid;
      gap: 16px;
      padding: 0;
      list-style: none;
    }
    .paper {
      padding: 24px;
      border: 1px solid #dbe3ee;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 14px 38px rgb(40 61 89 / 8%);
    }
    .paper h2 {
      margin: 8px 0;
      line-height: 1.3;
    }
    .paper a {
      color: inherit;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.15em;
    }
    .meta {
      margin: 0;
      font-size: 0.9rem;
    }
    code {
      padding: 0.15rem 0.35rem;
      border-radius: 0.35rem;
      background: #e8edf5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #eef4ff;
        background: #0e1420;
      }
      p {
        color: #a9b7ca;
      }
      .empty {
        border-color: #263247;
        background: #141c2a;
      }
      .paper {
        border-color: #263247;
        background: #141c2a;
      }
      code {
        background: #263247;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>每日 arXiv 论文带读</h1>
    <p>每天一篇 AI、金融或经济论文，用中文从基础讲清整篇主线。打开本篇总览，选择图解版或文章版即可，不必重复读两遍。</p>
  </header>
  <main id="paper-list">
    <section class="empty" id="empty-state">
      <h2>站点已经就绪</h2>
      <p>第一篇学习包发布后，这里会按日期列出论文标题、所属方向和课件入口。</p>
    </section>
  </main>
  <script>
    const list = document.querySelector("#paper-list");

    fetch("./papers.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((papers) => {
        if (!Array.isArray(papers) || papers.length === 0) return;

        const items = document.createElement("ol");
        items.className = "papers";

        for (const paper of papers) {
          const item = document.createElement("li");
          item.className = "paper";

          const meta = document.createElement("p");
          meta.className = "meta";
          meta.textContent = `${paper.date} · ${paper.direction} · arXiv:${paper.arxiv_id}`;

          const heading = document.createElement("h2");
          const link = document.createElement("a");
          link.href = paper.path;
          link.textContent = paper.title;
          heading.append(link);

          const summary = document.createElement("p");
          summary.textContent = paper.summary;

          item.append(meta, heading, summary);
          items.append(item);
        }

        list.replaceChildren(items);
      })
      .catch((error) => {
        console.error("无法读取论文清单", error);
      });
  </script>
</body>
</html>
