<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><ol><li><p>探索数量不等于跨越政治地理边界；附近新店可能拥有相似访客，而跨城目的地可能进入更混合的环境。</p></li><li><p>否则本人居住分数会进入地点分数，再反过来进入本人的经历分数，机械地抬高二者相关。</p></li><li><p>不能。出行不是随机分配，结果是潜在环境暴露的观察性关联，也没有直接测量政治态度变化。</p></li></ol><p><a href="notes.html">返回详细讲解</a></p></article></main>
