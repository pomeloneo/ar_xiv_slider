<main><article><h1>参考答案</h1><p>先尝试自行解释，再用这里核对理由。答案不是对你掌握程度的判定。</p><h2>第 1 题</h2><p>积极信号既包括真阳性也包括假阳性；合作的先验比例很低时，人数多的非合作情况仍会产生很多误报。</p><h2>第 2 题</h2><p>等待的折现损失变高，同一份未来收益折回今天更小，多次筛选不再划算。</p><h2>第 3 题</h2><p>要求修改不再保证能退出当前行动，因此无法只保留看起来有利的轮次；原文扩展需要持久的收益变化等额外条件。</p><p><a href="notes.html">返回详细讲解</a></p></article></main>
